[project]
name = "no-comments"
version = "0.8.0"
description = "pre-commit hook that rejects newly added code comments"
readme = "README.md"
authors = [
    { name = "Atticux", email = "hello@atticux.me" }
]
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.26.1",
    "tree-sitter-bash>=0.25.1",
    "tree-sitter-typescript>=0.23.2",
]

[project.scripts]
no-comments = "no_comments.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
